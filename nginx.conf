events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. Redirect all HTTP (Port 80) traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # 2. Main HTTPS Server (Port 443)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # SSL Certificates mounted from docker-compose
        ssl_certificate     /etc/nginx/certs/fullchain.pem; # or cert.crt
        ssl_certificate_key /etc/nginx/certs/privkey.pem;   # or cert.key

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Forward React / Static Assets / Vite Dev Server
        location / {
            # Change port to 5173 if ims-client is running `vite dev`, 
            # or port 80 if running a production built image (nginx)
            proxy_pass http://ims-client:5173; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Enable WebSockets for Vite HMR
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        # Forward API requests to Express backend
        location /api {
            proxy_pass http://ims-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Forward WebSocket connections
        location /ws {
            proxy_pass http://ims-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}