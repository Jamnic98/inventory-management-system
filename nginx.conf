events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    error_log /var/log/nginx/error.log debug;

    # 1. Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _; # Replace with your domain if using Certbot (e.g., example.com)

        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Server Block
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _; # Replace with your domain if applicable

        # SSL Certificates (Adjust paths to your SSL certs)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Basic SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 1. Forward React / Static Assets to Client container
        location / {
            proxy_pass http://ims-client:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 2. Forward API requests to Express/Node Backend container
        location /api {
            proxy_pass http://ims-server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 3. Handle WebSockets
        location /ws {
            proxy_pass http://ims-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}