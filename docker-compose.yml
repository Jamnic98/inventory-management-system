services:
  db:
    container_name: ims-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imssecret}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management_system}
    ports:
      - "5432:5432"
    volumes:
      - ims-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-inventory_management_system}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Dedicated migration job: runs ONCE when Postgres is ready, then exits cleanly
  migration:
    container_name: ims-migration
    build:
      context: ./server
      dockerfile: Dockerfile
    command: npx prisma db push
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dbuser}:${POSTGRES_PASSWORD:-imssecret}@db:5432/${POSTGRES_DB:-inventory_management_system}?schema=public
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  server:
    container_name: ims-server
    build:
      context: ./server
      dockerfile: Dockerfile
    networks:
      - app-network
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dbuser}:${POSTGRES_PASSWORD:-imssecret}@db:5432/${POSTGRES_DB:-inventory_management_system}?schema=public
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully # 👈 Waits for schema push to finish!

  client:
    container_name: ims-client
    build:
      context: ./client
      dockerfile: Dockerfile
    networks:
      - app-network
    depends_on:
      - server

  loadbalancer:
    container_name: loadbalancer
    image: nginx:1.27.5-alpine-slim
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - client
      - server

networks:
  app-network:
    driver: bridge

volumes:
  ims-db-data:
