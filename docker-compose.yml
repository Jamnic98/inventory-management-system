services:
  db:
    container_name: ims-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imssecret}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_management_system}
    ports:
      - "5432:5432"
    volumes:
      - ims-db-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dbuser} -d ${POSTGRES_DB:-inventory_management_system}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  loadbalancer:
    container_name: loadbalancer
    image: nginx:1.27.5-alpine-slim
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - app-network

  client:
    container_name: ims-client
    build:
      context: ./client
      dockerfile: Dockerfile
    networks:
      - app-network
    depends_on:
      - server

  server:
    container_name: ims-server
    build:
      context: ./server
      dockerfile: Dockerfile
    networks:
      - app-network
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

networks:
  app-network:

volumes:
  ims-db-data:
